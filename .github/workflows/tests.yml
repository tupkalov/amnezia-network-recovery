name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system Python D-Bus bindings
        run: sudo apt-get update && sudo apt-get install -y python3-dbus
      - name: Run unprivileged tests
        run: /usr/bin/python3 -I tests.py
      - name: Check dispatcher syntax
        run: sh -n 90-amnezia-route-repair
